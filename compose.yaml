services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://meridian:meridian@db:5432/meridian
      UPLOAD_DIR: /app/data/uploads
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["uploads:/app/data/uploads"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:3100}
      HOSTNAME: 0.0.0.0
    ports: ["127.0.0.1:3100:3100"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
  uploads:
