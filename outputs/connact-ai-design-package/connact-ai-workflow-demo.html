ss modules implemented", "priority": "Should", "status": "Not started", "evidence": "Pending specific phase", "prompt": "Soon pending"}], "phases": [{"n": 1, "name": "Resume search and AI writing", "goal": "Upload or hand-draw persona → search → save contact → write letter → preview and save draft", "deps": "Start from empty project; external credentials can be default and use explicit Mock", "gate": "Persona, contact, and draft persistence; facts have basis; no real sending", "exclude": "Login/Gmail/queue/send/inbox/automated email sequence", "file": "prompt-01-mvp.md", "prompt": "Please develop Connact.ai Phase 1: Resume-based People Search and AI Writing.\n\nConfirmed Constraints: Personal workspaces can connect to multiple Gmail mailboxes, teams are reserved; default English interface with support for Simplified Chinese, email language is independent; Finance is core, Academic is placeholder and contract; no automated email sequences in any phase. All modules are independent and usable, no forced step-by-step wizard. Do not treat Mock or HTML demos as real integrations.\n\nAdmin backend is listed as Soon, not part of P1–P4 implementation; only retain Coming Soon entry and scope description, no real management operations. Platform admin and personal workspace owner are different roles.\n\nFirst check workspace, AGENTS.md, and implemented code, provide a short implementation order, then proceed with development. Continue with existing data and modules, do not rebuild the entire project. Third-party capabilities check current official documentation; without credentials, explicitly Mock, real failures cannot be silently rolled back. Deliver code, migration, startup instructions, key validations, and real unverified items. Real sending only uses user-specified test recipients.\n\nThis phase only develops the minimal MVP: upload resume/draw persona → search financial contacts → view recommendation rationale → save contact → AI write email → edit, variable preview, and ext. Support comparison, adoption, discard, undo, and partial shortening/rewriting; suggestions should be bound to draft revision, expired results do not overwrite new drafts. Use Tiptap base rich text and variable nodes, missing variables are clearly identified; copied content must match preview. Server-side debounce save, version conflicts retain both contents; provide draft library and three Finance writing starters.\n\nTechnology: Next.js/React/TypeScript/Tiptap + FastAPI + PostgreSQL + Docker Compose. Fixed local workspace, all queries limited to workspace_id; this mode is only for local use. Encapsulate search, enrichment, public search, and AI Provider. Save PersonaVersion, SourceEvidence, MatchAssessment, GenerationRun, DraftRevision. Phase 1 does not install Redis, does not develop login, email, or sending.\n\nAcceptance: After refresh, personas/contacts/drafts exist; same person not duplicated; no facts created without evidence; generation failure retains original draft; missing variables cannot mark Ready; old suggestions cannot overwrite new edits; Mocks are explicitly stated; English default and Chinese switch are available. Deliver a runnable loop, not just page skeleton.\n"}, {"n": 2, "name": "Accounts, Gmail, and Single-Email Sending", "goal": "Login → multiple Gmail → pre-check → test/send single email in test/formal/scheduled mode", "deps": "P1 draft and workspace boundaries stable", "gate": "Two-user isolation; specified email real sending or truthfully mark unverified; idempotent/unknown handling", "exclude": "Complete Inbox/bulk activities/automated email sequence", "file": "prompt-02-mailboxes-send.md", "prompt": "Please develop Connact.ai Phase 2: Account Gmail and Single-Send.\n\nConfirmed Constraints: Personal workspaces can connect to multiple Gmail mailboxes, teams are reserved; default English interface with support for Simplified Chinese, email language is independent; Finance is core, Academic is placeholder and contract; no automated email sequences in any phase. All modules are independent and usable, no forced step-by-step wizard. Do not treat Mock or HTML demos as real integrations.\n\nAdmin backend is listed as Soon, not part of P1–P4 implementation; only retain Coming Soon entry and scope description, no real management operations. Platform admin and personal workspace owner are different roles.\n\nFirst check workspace, AGENTS.md, and implemented code, provide a short implementation order, then proceed with development. Continue with existing data and modules, do not rebuild the entire project. Third-party capabilities check current official documentation; without credentials, explicitly Mock, real failures cannot be silently rolled back. Deliver code, migration, startup instructions, key validations, and real unverified items. Real sending only uses user-specified test recipients.\n\nDevelop Phase 2 on top of Phase 1 code: formal account, multiple Gmail mailboxes, single test/formal/scheduled send. Do not develop full Inbox, batch Campaign, or auto follow-up.\n\nAccount: Implement Google platform login and User/Workspace/Membership, one Owner per personal workspace. Existing local demo data is explicitly migrated/claimed, cannot be automatically assigned to any logged-in user. Two test users must complete API/file/data isolation validation; production configuration disables demo login.\n\nEmail: Google platform login and Gmail authorization are separate, one user can connect to multiple and the login address is different. OAuth state, secure callback, applicable PKCE; Token/Refresh Token server-side encrypted, keys and database separated. Support refresh, expiration, disconnection/reauthorization, sender identity, platform signature, timezone, valid sending window, and platform limits. Apply for necessary permissions by function, separate explanation for public launch.\n\nSending: Reuse Phase 1 draft and preview, check recipient address, variables, attachments, HTML, block list, and email status before sending, freeze user-confirmed content version. Test defaults to sending to user's specified email, cannot count as formal delivery. Formal single send requires user confirmation; 'sent' only indicates provider acceptance. Attachments must be user-selected, check encoding and total size.\n\nScheduling: Add Redis/Worker, PostgreSQL persist SendJob/SendAttempt, execute by email timezone and window. Support cancel, pause, resume. API idempotency key, task uniqueness constraint, and execution lock prevent duplication. If already sent but response timeout, mark as unknown, first verify, do not blindly retry. Disconnection/failure stops the email task, manually banned address in workspace across emails takes effect.\n\nInterface reserves MailProvider's synchronous/reply capability but does not build Inbox UI in this phase. Record provider message/thread ID for association in Phase 3. Do not assume Gmail supports business idempotency key or absolute exactly-once.\n\nAcceptance: Two users and two Gmail mailboxes boundary correct; duplicate click does not duplicate task; specified test email completes real sending; test scheduling/cancel/disconnection/unknown scenarios. Deliver real adapter and Mock test when credentials are missing, mark real integration unverified. Keep Phase 1 persona search writing regression passing.\n"}, {"n": 3, "name": "Inbox and manual follow-up", "goal": "Synchronize emails → original thread reply → create reminder → active follow-up", "deps": "P2 Authorization and sending stability", "gate": "Real reply synchronization; expiration only reminder; new replies pause existing schedule", "exclude": "Auto next email / wait step / condition branch", "file": "prompt-03-inbox-followup.md", "prompt": "Please develop Connact.ai Phase 3: Inbox and Manual Follow-Up.\n\nConfirmed Constraints: Personal workspaces can connect to multiple Gmail mailboxes, teams are reserved; default English interface with support for Simplified Chinese, email language is independent; Finance is core, Academic is placeholder and contract; no automated email sequences in any phase. All modules are independent and usable, no forced step-by-step wizard. Do not treat Mock or HTML demos as real integrations.\n\nAdmin backend is listed as Soon, not part of P1–P4 implementation; only retain Coming Soon entry and scope description, no real management operations. Platform admin and personal workspace owner are different roles.\n\nFirst check workspace, AGENTS.md, and implemented code, provide a short implementation order, then proceed with development. Continue with existing data and modules, do not rebuild the entire project. Third-party capabilities check current official documentation; without credentials, explicitly Mock, real failures cannot be silently rolled back. Deliver code, migration, startup instructions, key validations, and real unverified items. Real sending only uses user-specified test recipients.\n\nDevelop Phase 3 on top of Phases 1 and 2: centralized Inbox, original conversation reply, manual follow-up, and protection for existing scheduling. Do not develop auto next email.\n\nSync: First read recent 30 days and paginate, persist history cursor, incremental polling defaults to two minutes and can be manually refreshed. Cursor expiration triggers sync recovery; ongoing old sessions continue tracking. Associate by workspace/mailbox/provider message/thread ID and deduplicate, messages sent and received outside the platform in Gmail can also enter the conversation.\n\nInbox: Three columns for filtering, conversation list, body and reply editor/contact sidebar. Support filtering by email, domain, unread, pending reply, and intent; unknown domain does not automatically fall under Finance. Read and archive sync with Gmail; notes, intent, and reminders only in the platform. Clean HTML, remote images default not loaded; attachments show metadata and available entry points.\n\nReply: Reuse draft and sending, maintain threadId, API。两者围绕同一 Contact 相互补充：Apollo 信息定位 LinkedIn，核对后的 LinkedIn URL/职业信息反向辅助 Apollo 匹配；现有适配器只有通用搜索与 Apollo ID 补充，定向查询及反向匹配需实现后验证。独立保留来源与获取时间，摘要保持待核实，冲突不覆盖，不按同名自动合并。实现职位/机构/地区/关键词分页、来源和时间、有限批量补充。邮箱未知如实显示。基于选定画像及来源生成简短推荐理由，不编造校友关系。保存按提供商 ID 去重，支持手工联系人、标签和备注。\n\nAI 写作：在联系人和画像基础上设置目的、CTA、语言、语气、长度。右侧显示可用证据与缺口，允许选取用于写信的事实。生成结构化 subject/body/claims/warnings，在建议区展示，不覆盖正文。支持比较、采纳、丢弃、撤销与局部缩短/改写；建议绑定草稿 revision，过期结果不覆盖新稿。使用 Tiptap 基础富文本与变量节点，缺失变量明确定位；复制内容必须与预览一致。服务端防抖保存、版本冲突保留双方内容；提供草稿库及三个 Finance 写作起点。\n\n技术：Next.js/React/TypeScript/Tiptap + FastAPI + PostgreSQL + Docker Compose。固定本地 workspace，所有查询限定 workspace_id；该模式只限本地。封装搜索、补充、公开搜索、AI Provider。保存 PersonaVersion、SourceEvidence、MatchAssessment、GenerationRun、DraftRevision。第一期不装 Redis、不开发登录、邮箱或发送。\n\n验收：刷新后画像/联系人/草稿存在；同人不重复保存；无证据不造事实；生成失败保留原稿；变量缺失不能标 Ready；旧建议不能覆盖新编辑；Mock 明示；英文默认及中文切换可用。交付可运行闭环，不停在页面骨架。\n"}, {"n": 2, "name": "账户 Gmail 与单封发送", "goal": "登录 → 多 Gmail → 预检 → 测试/正式/定时单封发送", "deps": "P1 草稿和工作区边界稳定", "gate": "两用户隔离；指定邮箱真实发信或如实标未验证；幂等/unknown 处理", "exclude": "完整 Inbox/批量活动/自动序列", "file": "prompt-02-mailboxes-send.md", "prompt": "请开发 Connact.ai 第 2 期：账户 Gmail 与单封发送。\n\n已确认约束：个人工作区可连接多个 Gmail，团队仅预留；默认英文界面并支持简体中文，邮件语言独立；Finance 是核心，Academic 仅占位与契约；四期均不做自动序列。所有模块独立可用，不强制分步向导。不要把 Mock 或 HTML 演示当作真实集成。\n管理员后端已列为 Soon 待排期，不属于 P1–P4 的实现范围；只保留 Coming Soon 入口与范围说明，不开放真实管理操作。平台管理员与个人工作区 Owner 是不同角色。\n先检查工作区、AGENTS.md 和已实现代码，给出简短实施顺序后直接开发。延续已有数据和模块，不重建整个项目。第三方能力查当前官方文档；没有凭据可显式 Mock，真实失败不能偷偷回退模拟。交付代码、迁移、启动说明、关键验证及真实未验证项。涉及真实发信仅用用户指定测试收件人。\n\n在第一期代码上开发第二期：正式账户、多个 Gmail、单封测试/正式/定时发送。不要开发完整 Inbox、批量 Campaign 或自动跟进。\n\n账户：实现 Google 平台登录及 User/Workspace/Membership，个人工作区一个 Owner。现有本地演示数据显式迁移/认领，不能自动归给任意登录用户。两个测试用户必须完成 API/文件/数据隔离验证；生产配置禁用演示登录。\n\n邮箱：Google 平台登录与 Gmail 授权分开，一个用户可连接多个且与登录地址不同。OAuth state、安全回调、适用 PKCE；Token/Refresh Token 服务端加密，密钥与数据库分开。支持刷新、失效、断连/重授权、授权发件身份、平台签名、时区、合法发送窗口和平台限额。按功能申请必要权限，公开上线审核单独说明。\n\n发送：复用一期草稿和预览，发送前检查收件地址、变量、附件、HTML、屏蔽列表及邮箱状态，冻结用户确认的内容版本。测试默认发给自己的指定邮箱，不能计入正式触达。正式单封由用户明确确认；sent 只表示提供商接受。附件必须用户主动选择，检查编码后总大小。\n\n定时：加入 Redis/Worker，PostgreSQL 持久化 SendJob/SendAttempt，按邮箱时区和窗口执行。支持取消、暂停、重启恢复。API 幂等键、任务唯一约束与执行锁配合防重。可能已发送但响应超时标 unknown，先核对，不盲目重试。断连/失效停止该邮箱任务，手动禁止地址在工作区跨邮箱生效。\n\n接口预留 MailProvider 的同步/回复能力但本期不建 Inbox UI。记录 provider message/thread ID，便于三期关联。不要假设 Gmail 支持业务幂等键或绝对 exactly-once。\n\n验收：两个用户与两个 Gmail 边界正确；重复点击不重复任务；指定测试邮箱完成真实发信；定时/取消/断连/unknown 场景测试。缺少凭据时交付真实适配器和 Mock 测试，标记真实集成未验证。保持一期画像搜索写作回归通过。\n"}, {"n": 3, "name": "收件箱与手动跟进", "goal": "同步邮件 → 原会话回复 → 创建提醒 → 主动跟进", "deps": "P2 授权与发送稳定", "gate": "真实回复同步；到期只提醒；新回复暂停既有排期", "exclude": "自动下一封/等待步骤/条件分支", "file": "prompt-03-inbox-followup.md", "prompt": "请开发 Connact.ai 第 3 期：收件箱与手动跟进。\n\n已确认约束：个人工作区可连接多个 Gmail，团队仅预留；默认英文界面并支持简体中文，邮件语言独立；Finance 是核心，Academic 仅占位与契约；四期均不做自动序列。所有模块独立可用，不强制分步向导。不要把 Mock 或 HTML 演示当作真实集成。\n管理员后端已列为 Soon 待排期，不属于 P1–P4 的实现范围；只保留 Coming Soon 入口与范围说明，不开放真实管理操作。平台管理员与个人工作区 Owner 是不同角色。\n先检查工作区、AGENTS.md 和已实现代码，给出简短实施顺序后直接开发。延续已有数据和模块，不重建整个项目。第三方能力查当前官方文档；没有凭据可显式 Mock，真实失败不能偷偷回退模拟。交付代码、迁移、启动说明、关键验证及真实未验证项。涉及真实发信仅用用户指定测试收件人。\n\n在前两期代码上开发第三期：集中 Inbox、原会话回复、手动跟进和对既有排期的回复保护。不开发自动下一封。\n\n同步：先读取最近 30 天并分页，持久化 history 游标，增量轮询默认两分钟并可手动刷新。游标失效执行恢复同步；进行中的旧会话继续跟踪。以 workspace/mailbox/provider message/thread ID 关联并去重，平台外在 Gmail 收发的消息也能进入会话。\n\nInbox：三栏为筛选、会话列表、正文与回复编辑器/联系人侧栏。支持邮箱、领域、未读、待回复和意向筛选；未知领域不自动归 Finance。已读与归档同步 Gmail；备注、意向、提醒只在平台。邮件 HTML 清理、远程图默认不加载；附件显示元数据及可用入口。\n\n回复：复用草稿与发送，维护 threadId、In-Reply-To、References 和主题关系。在指定收件端验证属于目标会话。只有实际收到消息才标已回复；区分人工、自动和未知，不能把自动回复作为人工回复指标。\n\n保护：新回复暂停该联系人的既有未发排期并提示检查，用户明确确认后可继续。这不是新建自动跟进。硬退信地址、退订及明确拒绝进入工作区级 suppression；跨邮箱和活动均执行。提供有效退订入口和手动标记，模糊自然语言只作辅助。\n\n手动跟进：FollowUpTask 关联联系人/会话，支持时间、备注、完成、改期、取消。到期只显示平台提醒；用户主动点击才进入原会话写信，可选模板/AI，再明确发送或排期。收到回复时提示检查关联任务，不自动发送。\n\n异常：界面显示最后同步时间、失败原因和权限状态；同步失败时暂停需要最新回复检查的排期。说明回复到达与发信之间仍存在的外部竞态，不承诺绝对零误发。\n\n验收：指定测试邮箱真实回复出现在 Inbox；重复/乱序同步不重复消息；游标恢复；归档状态正确；新回复暂停排期；跟进到期绝不发信；保留一期与二期回归。无真实凭据如实标记验证缺口。\n"}, {"n": 4, "name": "批量活动模板与统计", "goal": "模板 → 逐人预览 → 批量批准 → 活动控制 → 统计", "deps": "P3 同步与回复保护稳定", "gate": "逐人发送、取消生效、统计口径可核对；Academic 仅契约", "exclude": "团队协作/计费/Outlook真实接入/自动序列/导师数据库", "file": "prompt-04-campaigns-polish.md", "prompt": "请开发 Connact.ai 第 4 期：批量活动模板与统计。\n\n已确认约束：个人工作区可连接多个 Gmail，团队仅预留；默认英文界面并支持简体中文，邮件语言独立；Finance 是核心，Academic 仅占位与契约；四期均不做自动序列。所有模块独立可用，不强制分步向导。不要把 Mock 或 HTML 演示当作真实集成。\n管理员后端已列为 Soon 待排期，不属于 P1–P4 的实现范围；只保留 Coming Soon 入口与范围说明，不开放真实管理操作。平台管理员与个人工作区 Owner 是不同角色。\n先检查工作区、AGENTS.md 和已实现代码，给出简短实施顺序后直接开发。延续已有数据和模块，不重建整个项目。第三方能力查当前官方文档；没有凭据可显式 Mock，真实失败不能偷偷回退模拟。交付代码、迁移、启动说明、关键验证及真实未验证项。涉及真实发信仅用用户指定测试收件人。\n\n在前三期代码上开发第四期：批量活动、模板/Snippet 管理、基础统计、设置完善与 Academic 契约。当前仍不开发自动邮件序列、团队协作、计费或 Outlook 真实接入。\n\nCampaign 定义：一批用户明确批准的独立邮件；没有首封后自动产生第二封的能力。保存 CampaignRecipient 的联系人、画像版本、内容快照、邮箱、时间和结果。\n\n用户选择名单后逐人生成并预览邮件，统一显示缺失变量、重复联系人、无邮箱、屏蔽、附件、限额和时间问题。允许明确排除异常人，不能静默跳过。用户批准后逐人分别发送，不使用群体 To/CC。复用二期调度、幂等和三期回复保护。\n\n支持活动暂停/恢复/终止、单人退出、部分失败和进度。恢复重新计算合法窗口，不瞬间补发逾期任务。重试 unknown 先核对，禁止无脑重发。内容批准后模板更新不影响既有任务。\n\nTemplates/Snippets：Finance 分类、创建/编辑/版本/归档；Academic 仅示例分类。批量 AI 使用与一期一致的事实和人工采纳规则，不在后台临时编造个性化内容。\n\nAnalytics：正式发送邮件数和去重人数、人工回复人数、已检测退信、退订、活动进度和手动任务。明确事件、时间窗、分母及去重口径。测试和Mock独立，不造送达/打开/点击率。完善配置、数据导出/删除、错误和中英文文案。\n\nAcademic：保持 Coming Soon；设计学术画像及 Mentor 扩展、候选列表与共享模块关联。实现 MentorDataProvider/MentorMatchingProvider 契约测试，预留 JSONL/SQLite/Postgres/External 注册骨架。未实现返回明确 Unavailable，不伪造导师或空成功结果。\n\n验收：逐人预览与发出内容一致；重复启动不重复发；暂停/退出/回复/退订生效；统计可从事件核对。完成四期回归、运行文档、真实验证记录和公开上线外部事项清单。不要把完成设计文档或演示当作产品已完成。\n"}], "ai": [["W01", "设置 Brief", "Persona 版本、联系人、目的、CTA、语气、语言、长度", "保存写作意图，未选画像仍可手写", "可生成或待补充背景", "P1-16"], ["W02", "挑选证据", "confirmed / inferred / unknown / conflict；fact_id、来源", "默认仅建议 confirmed；用户可取消事实", "allowed_fact_ids 与待确认事实", "P1-17"], ["W03", "生成建议", "Brief + 允许事实 + 当前 revision", "模型返回建议；不替换正文", "subject、body_blocks、claims、warnings", "P1-18"], ["W04", "检查内容", "结构化输出、变量及引用", "确定性字段检查+模型辅助审阅；人工最终判断", "缺失、无来源陈述、长度建议", "P1-18"], ["W05", "采纳或丢弃", "当前稿和建议稿", "全文比较；采纳新 revision；可撤销", "新稿或保留原稿", "P1-19"], ["W06", "局部改写", "选区、base_revision、允许事实", "缩短/语气调整；无选区提示，不覆盖全文", "候选替换片段", "P1-20"], ["W07", "版本冲突", "新编辑产生不同 revision", "旧建议保持可读但禁用直接应用；重新生成", "不会丢失人工编辑", "P1-20、P1-23"], ["W08", "变量预览", "模板节点+联系人快照+用户字段", "必填无值阻止 Ready；默认值须明确", "最终主题/正文+missing_variables", "P1-22"], ["W09", "保存恢复", "editor_json、plain_text、revision", "防抖保存；失败可重试，409 保留两份", "Saved/Unsaved/Conflict", "P1-23"], ["W10", "正式批准", "二期邮件身份和内容快照", "预检并明确批准；后改稿不影响快照", "SendJob 或定时任务", "P2-05"], ["W11", "人工跟进", "三期原会话和任务", "到期提醒；人点击后才写下一封", "新的人工草稿", "P3-09"], ["W12", "批量逐人审阅", "四期联系人集合及逐人事实", "限定并发；逐人审阅和异常排除", "逐人内容快照", "P4-03"]], "interfaces": [["I01", "POST /documents", "P1", "multipart file", "document_id + status", "422 类型/大小；私有存储", "P1-06"], ["I02", "POST /documents/{id}/parse", "P1", "document_id", "parsed_fields + evidence_spans", "解析任务可轮询；扫描件明确拒绝", "P1-07"], ["I03", "POST /personas/{id}/versions", "P1", "用户确认字段+source_refs", "persona_version_id", "不可变版本；校验归属", "P1-07"], ["I04", "POST /people/search", "P1", "filters + cursor", "people + next_cursor + capabilities", "不承诺全部高级过滤；429明确", "P1-09"], ["I05", "POST /people/enrich", "P1", "provider_ids + requested_fields", "records + per_item_status", "按需有限批量；无邮箱为unknown", "P1-10"], ["I06", "POST /writing/generations", "P1", "brief + fact_ids + base_revision", "generation_id + candidate + warnings", "无工具执行权限；保留输入版本", "P1-18"], ["I07", "PATCH /drafts/{id}", "P1", "editor_json + expected_revision", "draft + new_revision", "409返回冲突，不静默覆盖", "P1-23"], ["I08", "POST /drafts/{id}/preview", "P1", "recipient_id + revision", "rendered + missing_variables", "统一确定性变量渲染", "P1-22"], ["I09", "GET /oauth/gmail/start", "P2", "session + state binding", "authorization redirect", "回调独立于平台登录", "P2-02"], ["I10", "POST /send-jobs", "P2", "snapshot_id + mailbox + send_at", "job_id + state", "Idempotency-Key；unknown先核对", "P2-08"], ["I11", "POST /mailboxes/{id}/sync", "P3", "cursor/server state", "sync_run + latest cursor", "游标失效恢复；不可跨租户", "P3-01"], ["I12", "POST /threads/{id}/replies", "P3", "draft_revision + mailbox", "send_job", "保留会话头；按二期发送", "P3-04"], ["I13", "POST /follow-up-tasks", "P3", "conta function personas(){el('view').innerHTML=heading('PHASE 1 / PERSONA',t('Your background, in your words',"由你确认的职业背景"),t('Review the extracted fields before they become writing evidence. You can also enter them manually.',"先检查提取字段，再用于写作证据；也可以完全手动填写。"))+`<div class="grid2"><section class="panel stack"><div class="upload"><h3>${t('Upload a CV',"上传简历")}</h3><small>${t('Product specification: text PDF / DOCX, up to 10 MB. This demo only reads the filename.',"产品规格：文本 PDF / DOCX，最大 10 MB。演示只读取文件名。")}</small><input id="cvFile" type="file" accept=".pdf,.docx" aria-label="CV demo file"><p id="fileStatus" class="muted"></p><button data-action="fixture">${t('Load fictional sample',"载入虚构示例")}</button></div><div class="fieldrow"><label>${t('Name',"姓名")}<input id="pName" value="${esc(s.profile.name)}"></label><label>${t('Education',"教育背景")}<input id="pDegree" value="${esc(s.profile.degree)}"></label></div><label>${t('Experience',"工作经历")}<textarea id="pExperience">${esc(s.profile.experience)}</textarea></label><label>${t('Career goal',"职业目标")}<textarea id="pGoal">${esc(s.profile.goal)}</textarea></label><div class="row space"><span class="tag">${s.confirmed?t('Confirmed in demo',"已在演示中确认"):t('Needs your review',"等待校对")}</span><button class="primary" data-action="confirm">${t('Confirm persona',"确认画像")}</button></div></section><section class="stack"><div class="panel"><h2>${t('From background to draft',"从背景到邮件草稿")}</h2><div class="steps"><div class="step"><div><b>${t('Confirm facts',"确认事实")}</b><p class="muted">${t('Keep facts editable and tied to a source.',"字段可编辑，且保留来源。")}</p></div></div><div class="step"><div><b>${t('Find relevant people',"寻找相关联系人")}</b><p class="muted">${t('Search works even without a persona.',"没有画像也可以直接搜索。")}</p></div></div><div class="step"><div><b>${t('Review every suggestion',"检查每份建议稿")}</b><p class="muted">${t('AI never overwrites your draft without Apply.',"没有采纳动作，AI 不覆盖正文。")}</p></div></div></div><button data-module="search">${t('Open People Search',"打开人员搜 function personTable(list,save=true){return `<div class="tablewrap"><table><thead><tr><th>${t('Person',"联系人")}</th><th>${t('Fit & evidence',"相关性与证据")}</th><th>${t('Email',"邮箱")}</th><th>${t('Actions',"操作")}</th></tr></thead><tbody>${list.map(p=>`<tr><td><div class="person"><div class="avatar">${p.name.split(' ').map(x=>x[0]).join('')}</div><div><b>${esc(p.name)}</b><br><small>${p.title} · ${p.company}<br>${p.location}</small></div></div></td><td><div class="reason">${p.id==='maya'?t('Healthcare role in London aligns with the sample goal. No alumni claim: education is unknown.',"伦敦医疗行业岗位与示例目标相关。学校未知，不声称校友。"):t('Review sector and location against your goal before writing.',"写信前核对领域和地点与目标的关系。")}</div><span class="tag">${t('Fictional source',"虚构资料来源")}</span></td><td><small>${p.email?t('Unverified demo address',"未验证演示地址"):t('Missing address',"邮箱缺失")}</small></td><td><div class="row">${save?`<button data-save="${p.id}">${s.saved.includes(p.id)?t('Saved',"已保存"):t('Save',"保存")}</button>`:''}<button data-sources="${p.id}">${t('View both sources',"查看双源示例")}</button><button data-write="${p.id}" class="primary">${t('Write',"写邮件")}</button></div></td></tr>`).join('')}</tbody></table></div>`}
function search(){el('view').innerHTML=heading('PHASE 1 / DISCOVERY',t('Find your next conversation',"找到下一位交流对象"),t('Apollo people data and LinkedIn public-profile leads complement each other. All three people below are fictional.',"Apollo 联系人数据与 LinkedIn 公开资料相互补充。下面三位人物均为虚构示例。"))+`<section class="panel stack" id="sourceSynergy" style="margin-bottom:18px"><h2>${t('Apollo and LinkedIn work together',"Apollo 与 LinkedIn 协同找人")}</h2><div class="grid3"><div><h3>Apollo</h3><p>${t('Find people by role, company and location. Request available email details separately.',"按职位、机构和地区找人，按需补充可用邮箱。")}</p></div><div><h3>LinkedIn · SerpAPI</h3><p>${t('Use contact details to search public LinkedIn profiles through Google. Keep profile links and snippets for review.',"利用联系人信息，经 Google 检索 LinkedIn 公开档案，保留链接和摘要供核对。")}</p></div><div><h3>${t('One contact, linked sources',"同一联系人，关联两路来源")}</h3><p>${t('Reviewed profile details can refine Apollo matching. Preserve disagreements; use confirmed facts for writing.',"核对后的档案信息可反向辅助 Apollo 匹配。保留冲突，写信采用已确认事实。")}</p></div></div><small>${t('Target design. This offline demo makes no API requests. The current MVP still uses generic Google queries; LinkedIn targeting and reverse matching remain to be implemented.',"目标设计：离线演示不调用 API。当前 MVP 仍使用通用 Google 查询，LinkedIn 定向检索与反向匹配待实现。")}</small></section><section class="panel stack"><div class="filters"><label>${t('Location',"地区")}<select id="location"><option value="all">${t('All locations',"全部地区")}</option><option>London</option><option>New York</option></select></label><label>${t('Keyword',"关键词")}<input id="keyword" placeholder="Healthcare, Associate…"></label><button class="primary" data-action="search">${t('Search sample data',"搜索示例数据")}</button></div><div id="resultStatus" class="muted">${t('3 demo people · source confidence and match relevance are different.',"3 位演示联系人 · 资料可信程度与匹配相关性是两件事。")}</div><div id="results">${personTable(people)}</div><div class="row"><button data-action="apiError">${t('Simulate provider error',"模拟数据源错误")}</button><small>${t('No silent fallback to mock on a real provider failure.',"真实服务失败时不得静默回退模拟成功。")}</small></div></section>`}
function contacts(){const list=people.filter(p=>s.saved.includes(p.id));el('view').innerHTML=heading('PHASE 1 / CONTACTS',t('Saved people',"已保存的联系人"),t('Contacts link to personas, evidence and drafts. Saving the same source twice does not duplicate it.',"联系人关联画像、证据和草稿。重复保存同一来源不重复建人。"))+`<div class="panel">${list.length?personTable(list,false):`<p>${t('No saved contacts yet.',"还没有保存的联系人。")}</p><button data-module="search">${t('Search people',"搜索联系人")}</button>`}</div>`}
function studio(){const p=selected();el('view').innerHTML=heading('PHASE 1 / EMAIL STUDIO',t('A personal email, grounded in facts',"有事实依据的个性化邮件"),t('Generate a suggestion, compare it, then decide what to apply. Your existing draft stays yours.',"先生成建议、比较，再决定采纳内容。现有草稿始终由你控制。"))+`<div class="panel" style="margin-bottom:18px"><div class="fieldrow"><label>${t('Recipient',"收件人")}<select id="recipient">${people.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${x.name} · ${x.company}</option>`).join('')}</select></label><label>${t('Persona',"职业画像")}<input readonly value="${esc(s.profile.name)} · ${esc(s.profile.degree)}"></label></div><div class="fieldrow" style="margin-top:12px"><label>${t('Purpose',"联系目的")}<select id="purpose">${['Networking','Informational Interview','Recruiting'].map(x=>`<option ${s.brief.purpose===x?'selected':''}>${x}</option>`).join('')}</select></label><label>${t('Email language',"邮件语言")}<select id="emailLang"><option value="en" ${s.brief.language==='en'?'selected':''}>English</option><option value="zh" ${s.brief.language==='zh'?'selected':''}>简体中文</option></select></label></div><label style="margin-top:12px">${t('Call to action',"希望对方做什么")}<input id="cta" value="${esc(s.brief.cta)}"></label></div><div class="composer"><section class="editor"><div class="editorhead"><label>${t('Subject',"邮件主题")}<input id="subject" value="${esc(s.subject)}" placeholder="${t('Write a subject or generate a suggestion',"输入主题或生成建议")}"></label></div><div class="toolbar"><button data-action="variable">+ {{first_name}}</button><button data-action="shorten">${t('Suggest a shorter version',"建议缩短全文")}</button><button data-action="undo" ${!s.previous?'disabled':''}>${t('Undo apply',"撤销采纳")}</button><span class="tag">${t('Plain-text demo',"纯文本交互演示")}</span></div><div id="body" class="bodyedit" role="textbox" aria-label="Email body" aria-multiline="true" contenteditable="true" data-placeholder="${t('Start writing here. Generating a suggestion will not replace this text.',"在这里写信。生成建议不会替换当前正文。")}">${esc(s.body)}</div><div class="editorfoot row space"><span id="saveState" class="pilltime">${t('Stored locally',"本地保存")} · revision ${s.rev}</span><div class="row"><button data-action="preview">${t('Preview',"预览")}</button><button class="primary" data-action="saveDraft">${t('Save draft',"保存草稿")}</button></div></div></section><div class="stack"><section class="panel"><div class="row space"><h2>${t('Evidence for this email',"本封邮件的证据")}</h2><span class="tag">DEMO</span></div>${[['role',`${p.title} · ${p.sector} · ${p.company}`,t('Source C01 · Apollo-style fictional contact record',"来源 C01 · 模拟 Apollo 联系人记录")],['background',s.profile.experience,t('Source P01 · persona confirmed by you',"来源 P01 · 由你确认的画像")],['goal',s.profile.goal,t('Source P02 · your stated goal',"来源 P02 · 用户目标")]].map(f=>`<div class="fact"><label><input type="checkbox" data-fact="${f[0]}" ${s.facts.includes(f[0])?'checked':''}><span>${esc(f[1])}</span></label><small>${f[2]}</small></div>`).join('')}<div class="fact"><label><input type="checkbox" disabled><span>${t('Shared university: no supporting evidence',"共同学校：没有支持证据")}</span></label><small>${t('Excluded. AI must not invent an alumni connection.',"已排除。AI 不得编造校友关系。")}</small></div><button class="primary" style="margin-top:14px" data-action="generate">${t('Generate suggestion',"生成建议稿")}</button><p id="genStatus" class="muted" style="margin-top:10px"></p></section><section id="candidatePanel" class="panel">${candidateHTML()}</section></div></div><div class="row" style="margin-top:16px"><button data-action="missing">${t('Toggle missing-name scenario',"切换姓名缺失场景")}</button><button data-action="stale">${t('Simulate outdated suggestion',"模拟过期建议")}</button><small>${t('Full rich-text editing is specified in Word; this demo focuses on AI decisions.',"完整富文本功能在 Word 中定义；本演示重点展示 AI 写作决策。")}</small></div>`;}
function candidateHTML(){if(!s.candidate)return `<h2>${t('AI suggestion',"AI 建议稿")}</h2><p class="muted">${t('Suggestions appear here. Nothing is applied automatically.',"建议出现在此处，不会自动写入正文。")}</p>`;const c=s.candidate,stale=c.base!==s.rev;return `<h2>${t('Review before applying',"采纳前请审阅")}</h2><div class="candidate"><b>${esc(c.subject)}</b><p class="candidate-body">${esc(c.body)}</p></div><p class="muted" style="margin-top:12px">${t('Evidence used',"使用证据")}: ${esc(c.facts.join(', ')||t('None',"无"))}</p>${stale?`<p class="alert">${t('Outdated: your draft changed after generation. Regenerate or copy manually.',"建议已过期：生成后正文发生变化，请重新生成或手动复制。")}</p>`:''}<div class="row"><button class="primary" data-action="apply" ${stale?'disabled':''}>${t('Apply suggestion',"采纳建议")}</button><button data-action="discard">${t('Discard',"丢弃")}</button></div>`}
function readBrief(){if(el('purpose'))s.brief.purpose=el('purpose').value;if(el('emailLang'))s.brief.language=el('emailLang').value;if(el('cta'))s.brief.cta=el('cta').value;}
function generate(short=false){readBrief();const p=selected(),zh=s.brief.language==='zh';let subject=zh?"关于金融行业交流的简短邀请":'A brief question about '+(s.facts.includes('role')?p.sector:'your experience');let body=zh?"你好，{{first_name}}：\n\n":'Hi {{first_name}},\n\n';
 if(short&&s.body){body=s.body.split(/\n\n/).filter((x,i)=>i!==2).join('\n\n');if(body===s.body)body=s.body.length>80?s.body.slice(0,s.body.lastIndexOf(' ',Math.floor(s.body.length*.8)))+'…':s.body;subject=s.subject||subject;}
 else {const parts=[];if(s.facts.includes('goal'))parts.push(zh?`我正在探索 ${s.profile.goal}。`:`I am exploring ${s.profile.goal}.`);if(s.facts.includes('background'))parts.push(zh?`我有以下相关经历：${s.profile.experience}。`:`My background includes ${s.profile.experience}.`);if(s.facts.includes('role'))parts.push(zh?`你在 ${p.company} 担任 ${p.title}，工作方向是 ${p.sector}，因此希望向你了解这个领域。`:`Your work as ${p.title.toLowerCase()==='associate'?'an':'a'} ${p.title.toLowerCase()} in ${p.sector} at ${p.company} is relevant to the direction I am considering.`);body+=parts.join(' ')+'\n\n'+(zh?`如果方便，我希望与你交流：${s.brief.cta}。时间可以配合你的安排。\n\n祝好，\n`:`If you have time, I would appreciate ${s.brief.cta}. I would be happy to work around your schedule.\n\nBest,\n`)+s.profile.name;}
 s.candidate={subject,body,base:s.rev,facts:[...s.facts],purpose:s.brief.purpose};persist();el('candidatePanel').innerHTML=candidateHTML();if(el('genStatus'))el('genStatus').textContent=t('Demo suggestion ready. Your draft has not changed.',"演示建议已生成，当前正文没有变化。");}
function finalDraft(){const first=s.missing?'':selected().first;const missing=[];const render=v=>v.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(full,key)=>{const values={first_name:first,company:selected().company,title:selected().title,school:selected().school,sender_name:s.profile.name};if(!values[key]){missing.push(key);return `[MISSING: ${key}]`;}return values[key]});return {subject:render(s.subject),body:render(s.body),missing:[...new Set(missing)]};}
function preview(){const r=finalDraft();dialog(t('Recipient preview',"联系人效果预览"),`<div class="row"><span class="tag">${esc(selected().name)}</span><span class="tag ${r.missing.length?'warn':''}">${r.missing.length?t('Needs information',"待补信息"):t('Draft preview ready · not sent',"草稿预览就绪 · 未发送")}</span></div>${r.missing.length?`<p class="alert error" style="margin-top:12px">${t('Missing variables',"缺失变量")}: ${esc(r.missing.join(', '))}</p>`:''}<h3 style="margin-top:22px">${esc(r.subject||t('(No subject)',"（无主题）"))}</h3><div class="previewbody">${esc(r.body||t('(Empty draft)',"（空草稿）"))}</div><div class="row" style="margin-top:22px"><button data-action="copyDraft" ${r.missing.length||!r.body||!r.subject?'disabled':''}>${t('Copy final email',"复制最终邮件")}</button><small>${t('No Gmail call is made.',"不会调用 Gmail。")}</small></div>`)}

function inbox(){el('view').innerHTML=heading('PHASE 3 / INBOX',t('Conversations and deliberate follow-up',"会话与手动跟进"),t('A reminder is a task. It never creates or sends the next email automatically.',"提醒是一项任务，不会自动生成或发送下一封邮件。"))+`<div class="grid2"><div class="panel"><span class="tag">${t('Demo thread',"演示会话")}</span><h2 style="margin-top:12px">Re: A brief question about healthcare investment banking</h2><p><b>Maya Patel</b> <small>· ${t('Fictional reply',"虚构回复")}</small></p><p>${t('Hi Alex, happy to share a few thoughts. Could you send a little more detail about your interests?',"Alex 你好，很乐意交流。可以再介绍一下你的兴趣方向吗？")}</p><div class="row"><button data-action="replyDemo">${t('Open manual reply draft',"打开手动回复草稿")}</button><button data-action="replyArrived">${t('Simulate new reply',"模拟新回复到达")}</button></div><p id="replyState" class="alert" style="margin-top:18px">${s.paused?t('Existing pending send paused for review. No new email created.',"已有待发送排期暂停，等待检查。未创建新邮件。"):t('Click above to see how a reply protects an existing scheduled email.',"点击上方查看回复如何保护既有定时邮件。")}</p></div><div class="panel stack"><h2>${t('Manual follow-up',"手动跟进")}</h2><label>${t('Reminder date',"提醒日期")}<input id="taskDate" type="date" value="2026-09-10"></label><label>${t('Internal note',"内部备注")}<textarea id="taskNote">Ask whether next week works for a brief conversation.</textarea></label><button class="primary" data-action="task">${t('Create reminder',"创建提醒")}</button><div id="taskState">${s.task?`<span class="tag">${s.taskDone?t('Completed',"已完成"):t('Reminder created',"提醒已创建")}</span>`:''}</div><div class="row"><button data-action="taskDue">${t('Simulate due time',"模拟提醒到期")}</button><button data-action="taskDone">${t('Complete task',"完成任务")}</button></div><small>${t('The number of sent messages will not change when the task is due.',"任务到期不会改变已发送邮件数量。")}</small></div></div>`}
function campaigns(){el('view').innerHTML=heading('PHASE 4 / CAMPAIGNS',t('Review one email for each person',"逐人审阅独立邮件"),t('A campaign groups approved sends. It has no sequence steps or automatic next email.',"活动组织一批已批准邮件，不包含序列步骤或自动下一封。"))+`<div class="panel stack"><div class="row space"><h2>London networking · Demo</h2><span class="tag warn">${t('Review required',"需要审阅")}</span></div>${personTable(people,false)}<div class="alert">${t('3 people · 1 missing email · all addresses are fictional and cannot be sent. Production must explicitly exclude invalid recipients.',"3 位联系人 · 1 位缺少邮箱 · 所有地址均为虚构，不能真实发送。产品必须明确排除异常收件人。")}</div><div class="row"><button data-action="campaignReview">${t('Inspect preflight report',"查看批量预检报告")}</button><button data-action="pause">${s.paused?t('Resume demo activity',"恢复演示活动"):t('Pause demo activity',"暂停演示活动")}</button></div></div>`}

const flowNodes=[['Review CV',"简历校对",'Document → PersonaVersion','Only confirmed fields become facts.',"仅确认字段作为事实。"],['Find people',"搜索联系人",'Apollo ↔ LinkedIn → Contact','Apollo locates people; LinkedIn public leads support profile matching.',"Apollo 找人，LinkedIn 公开线索辅助核对与匹配。"],['Select evidence',"选择证据",'SourceEvidence → allowed_fact_ids','Unknown school never becomes an alumni claim.',"学校未知不生成校友陈述。"],['Review suggestion',"审阅建议",'GenerationRun → DraftRevision','Apply is explicit. Stale suggestions cannot overwrite edits.',"明确采纳，过期建议不覆盖人工编辑。"],['Preview & save',"预览保存",'Variables → PreviewResult','Missing variables block Ready. No send in phase 1.',"缺失变量阻止就绪，一期不发送。"]];
function workflow(){const n=flowNodes[flowIndex];const cases={normal:[t('Happy path',"正常路径"),t('Confirm a persona, choose a person and evidence, apply a suggestion, then preview and save.',"确认画像，选择联系人和证据，采纳建议，预览并保存。")],missing:[t('Missing school',"学校未知"),t('Exclude the alumni claim. Keep the relevant sector-based introduction; writing can continue.',"排除校友陈述，保留领域相关的开头，仍可继续写信。")],api:[t('Provider failure',"服务商失败"),t('Show an actionable error and keep the current draft. Do not silently replace results with mock success.',"显示具体错误并保留当前草稿，不静默回退模拟成功。")],stale:[t('Outdated suggestion',"建议过期"),t('base_revision differs from the current revision. Preserve both versions, disable Apply and allow regeneration.',"base_revision 与当前版本不同，保留两份内容，禁用采纳并可重新生成。")],reply:[t('Reply arrives in phase 3',"三期收到新回复"),t('Pause existing pending sends for this person. A due follow-up task still only produces a reminder.',"暂停此联系人已有待发送任务，手动跟进到期仍然只提醒。")]};el('view').innerHTML=heading('WORKFLOW',t('Trace a decision, not a forced wizard',"查看决策流程，而不是强制向导"),t('Click any step. Modules stay independently accessible. The scenarios show how errors change the flow.',"点击任一步查看。模块始终可独立进入，异常场景展示流程如何变化。"))+`<div class="flow">${flowNodes.map((x,i)=>`<button data-flow="${i}" class="${flowIndex===i?'active':''}"><span class="num">0${i+1}</span><b>${t(x[0],x[1])}</b></button>`).join('')}</div><div class="grid2"><div class="panel"><div class="eyebrow">STEP ${flowIndex+1}</div><h2>${t(n[0],n[1])}</h2><p>${t(n[3],n[4])}</p><div class="log">${esc(n[2])}</div><div class="row" style="margin-top:16px"><button data-action="flowPrev">← ${t('Previous',"上一步")}</button><button class="primary" data-action="flowNext">${t('Next decision',"下一决策")} →</button><button data-action="flowOpen">${t('Open product module',"打开对应模块")}</button></div></div><div class="panel stack"><label>${t('Scenario',"异常场景")}<select id="scenario">${Object.entries(cases).map(([k,v])=>`<option value="${k}" ${scenario===k?'selected':''}>${v[0]}</option>`).join('')}</select></label><h2>${cases[scenario][0]}</h2><p>${cases[scenario][1]}</p><div class="alert">${t('Reminder ≠ automatic follow-up. Sent ≠ delivered. A suggestion ≠ an approved draft.',"提醒不等于自动跟进；发送不等于送达；建议不等于已批准草稿。")}</div></div></div>`}
const nodes=[
{n:'Next.js / Browser',p:1,role:'UI, editor, i18n',zh:"界面、编辑器、中英文",detail:"The browser sends IDs and user intent. It does not hold provider keys or call Gmail directly. / 浏览器提交对象ID与意图，不持有服务商密钥，不直连Gmail。"},

function architecture(){const n=nodes[archIndex];el('view').innerHTML=heading('TECHNICAL ARCHITECTURE',t('Add services when the workflow needs them',"按工作流需要逐期接入服务"),t('Phase 1 is a modular monolith. Redis and workers arrive with scheduled sending in phase 2. Click a component to inspect its boundary.',"一期采用模块化单体，二期定时发送才加入 Redis 与 Worker。点击组件查看职责边界。"))+`<div class="row"><button class="primary" data-action="trace">${t('Trace next writing request step',"追踪写作请求下一步")}</button><button data-action="traceReset">${t('Restart trace',"重置追踪")}</button><span class="muted">${t('Current',"当前")}: ${nodes[trace[traceIndex]].n}</span></div><div class="arch">${nodes.map((x,i)=>`<button data-arch="${i}" class="${i===trace[traceIndex]?'trace':''} ${x.p>phase?'off':''}"><div class="row space"><b>${x.n}</b><span class="tag future">${x.p===5?'Soon':'P'+x.p}</span></div><small>${t(x.role,x.zh)}</small>${x.p>phase?`<small>${t('Not in selected phase',"当前阶段未接入")}</small>`:''}</button>`).join('')}</div><div class="grid2"><div class="panel"><h2>${n.n}</h2><p>${n.detail}</p><span class="tag">${n.p===5?t('Soon · phase unassigned',"Soon · 期次待定"):t('Introduced in phase',"接入期次")+' '+n.p}</span></div><div class="panel"><h2>${t('AI writing data flow',"AI 写作数据流")}</h2><div class="log">Browser → Core → Evidence DB\n→ Writing service → AI adapter\n→ Validate candidate → GenerationRun\n→ Browser review → explicit Apply\n→ DraftRevision</div><p class="muted" style="margin-top:12px">${t('The model cannot cross into the send boundary.',"模型不能越过人工批准直接发信。")}</p></div></div>`}

function adminSoon(){el('view').innerHTML=heading('COMING SOON',t('Platform administration',"平台管理后台"),t('Operations and support tools planned for a future release. The phase 1 MVP stays unchanged.',"平台运营与维护工具已列入后续排期，第一期最小 MVP 范围不变。"))+adminCard()}
function roadmap(){el('view').innerHTML=heading('DELIVERY PLAN',t('Four prompts, one evolving codebase',"四份 Prompt，持续开发同一代码库"),t('Finish and verify one phase before expanding. Real integration checks are separate from this offline demo.',"每期完成验证再扩展；真实集成验收与离线演示分开。"))+`<div class="timeline">${DATA.phases.map(p=>`<div class="phasecard ${phase===p.n?'active':''}"><span class="eyebrow">PHASE ${p.n}</span><h3>${p.name}</h3><p>${p.goal}</p><p><b>${t('Gate',"验收门槛")}</b><br>${p.gate}</p><p class="muted">${t('Excluded',"不包含")}: ${p.exclude}</p><button data-prompt="${p.n}">${t('Read and copy prompt',"查看并复制 Prompt")}</button><p style="margin-top:10px"><small>${DATA.features.filter(x=>x.phase===p.n).length} ${t('planned features',"项计划功能")}</small></p></div>`).join('')}</div><div class="panel" style="margin-top:24px"><h2>${t('Handoff rule',"交接规则")}</h2><p>${t('Phase 2 implements login before connecting real mailboxes. Phase 4 improves account settings; it does not postpone basic identity isolation. Every new prompt begins by inspecting and extending the existing repository.',"二期在真实邮箱前实现登录。四期只完善设置，不推迟基本身份隔离。每份新 Prompt 都要求先检查并延续现有代码。")}</p><p><a href="connact-ai-detailed-design.docx">Word ${t('detailed design',"详细设计")}</a> · <a href="connact-ai-feature-roadmap.xlsx">Excel ${t('feature roadmap',"功能清单")}</a></p></div>`+adminCard()}
document.addEventListener('click',async e=>{

 if(b.dataset.write){switchRecipient(b.dataset.write);module='studio';tab='product';s.candidate=null;persist();shell();return;}
 if(b.dataset.flow!==undefined){flowIndex=+b.dataset.flow;workflow();return;}if(b.dataset.arch!==undefined){archIndex=+b.dataset.arch;architecture();return;}
 if(b.dataset.prompt){const p=DATA.phases.find(x=>x.n===+b.dataset.prompt);dialog('Phase '+p.n+' · '+p.name,`<p><a href="${p.file}" download>${t('Download Markdown',"下载 Markdown")}</a></p><div class="prompttext" id="promptText">${esc(p.prompt)}</div><button class="primary" style="margin-top:15px" data-action="copyPrompt">${t('Copy prompt',"复制 Prompt")}</button>`);return;}

 const a=b.dataset.action;
 if(a==='fixture'){s.profile=initial().profile;s.confirmed=false;persist();personas();el('fileStatus').textContent=t('Fictional sample loaded. No uploaded document was parsed.',"已载入虚构示例，未解析上传文件。");}
 if(a==='confirm'){s.profile={name:el('pName').value,degree:el('pDegree').value,experience:el('pExperience').value,goal:el('pGoal').value};if(!s.profile.name.trim())return toast(t('Enter a name.',"请输入姓名。"));s.confirmed=true;persist();personas();toast(t('Persona confirmed locally.',"画像已在本地确认。"));}
 if(a==='search'){const l=el('location').value,k=el('keyword').value.trim().toLowerCase();const list=people.filter(p=>(l==='all'||p.location===l)&&JSON.stringify(p).toLowerCase().includes(k));el('results').innerHTML=list.length?personTable(list):`<p class="alert">${t('No matching fictional records. Adjust your filters.',"虚构示例中没有匹配结果，请调整条件。")}</p>`;el('resultStatus').textContent=list.length+t(' demo result(s)'," 条演示结果");}
 if(a==='apiError'){el('results').innerHTML=`<div role="alert" class="alert error">PROVIDER_RATE_LIMITED · ${t('Demo failure. Current contacts and drafts are preserved. Retry search to return to sample data.',"演示失败。已有联系人与草稿保留。重新搜索可回到示例数据。")}</div>`;}
 if(a==='generate'||a==='shorten'){if(!s.confirmed)return toast(t('Confirm the persona first, or keep writing manually.',"请先确认画像，也可以继续手动写信。"));if(a==='shorten'&&!s.body.trim())return toast(t('Write or apply a draft first.',"请先写信或采纳草稿。"));generate(a==='shorten');}
 if(a==='apply'&&s.candidate){if(s.candidate.base!==s.rev)return toast(t('Outdated suggestion. Regenerate.',"建议已过期，请重新生成。"));s.previous={body:s.body,subject:s.subject};s.body=s.candidate.body;s.subject=s.candidate.subject;s.rev++;s.candidate=null;s.draftSaved=false;persist();studio();}
 if(a==='discard'){s.candidate=null;persist();studio();}
 if(a==='undo'&&s.previous){s.body=s.previous.body;s.subject=s.previous.subject;s.previous=null;s.rev++;s.candidate=null;persist();studio();}
 if(a==='variable'){s.body+=' {{first_name}}';s.rev++;persist();studio();}
 if(a==='saveDraft'){s.draftSaved=true;persist();toast(t('Draft saved locally. No email sent.',"草稿已本地保存，未发送邮件。"));}
 if(a==='preview')preview();
 if(a==='missing'){s.missing=!s.missing;persist();preview();}
 if(a==='stale'){if(!s.candidate)generate();if(!s.candidate)return;s.body+=(s.body?'\n\n':'')+t('Manual edit made after generation.',"生成后新增的人工编辑。");s.rev++;persist();studio();}
 if(a==='copyDraft'){const r=finalDraft();await copy(r.subject+'\n\n'+r.body);}
 if(a==='copyPrompt')await copy(el('promptText').textContent);
 if(a==='testSend'){const r=el('testRecipient').value;if(!r.includes('@'))return toast(t('Enter a test address.',"请输入测试地址。"));s.sent.push({type:'test',recipient:r});persist();el('sendResult').textContent=t('Simulated event recorded. Nothing was sent to ',"已记录模拟事件，未向以下地址真实发信：")+r;}
 if(a==='unknown')el('sendResult').innerHTML=`<span class="tag warn">unknown</span> ${t('Reconcile before retry. No automatic resend.',"重试前先核对，不自动重发。")}`;
 if(a==='task'){s.task=true;s.taskDone=false;persist();inbox();toast(t('Reminder created locally.',"提醒已在本地创建。"));}
 if(a==='taskDue'){if(!s.task)return toast(t('Create a reminder first.',"请先创建提醒。"));el('taskState').innerHTML=`<div class="alert">${t('Due now. Open the thread when ready. No email was created or sent.',"已到期，请主动打开会话。未生成或发送邮件。")}</div>`;}
 if(a==='taskDone'){if(!s.task)return toast(t('No reminder yet.',"尚未创建提醒。"));s.taskDone=true;persist();inbox();}
 if(a==='replyArrived'){s.paused=true;persist();inbox();}
 if(a==='replyDemo'){switchRecipient('maya');s.previous={body:s.body,subject:s.subject};s.body='Hi Maya,\n\nThank you for your reply. ';s.subject='Re: A brief question about healthcare investment banking';s.rev++;s.selected='maya';s.candidate=null;module='studio';persist();shell();}
 if(a==='campaignReview')dialog(t('Batch preflight report',"批量预检报告"),`<div class="alert error">${t('Demo only — all addresses are fictional, so no production send can be approved.',"仅演示：所有地址均虚构，不能批准真实发送。")}</div><p style="margin-top:16px">Maya: ${t('Review required; demo address',"待审阅；演示地址")}<br>Daniel: ${t('Missing email',"缺少邮箱")}<br>Sophia: ${t('Review location mismatch',"需核对地点不匹配")}</p><p>${t('Production must explicitly exclude invalid recipients and approve one content snapshot per person.',"真实产品必须明确排除异常收件人，逐人批准内容快照。")}</p>`);
 if(a==='pause'){s.paused=!s.paused;persist();campaigns();}
 if(a==='flowNext'){flowIndex=(flowIndex+1)%5;workflow();}if(a==='flowPrev'){flowIndex=(flowIndex+4)%5;workflow();}
 if(a==='flowOpen'){module=['personas','search','studio','studio','studio'][flowIndex];tab='product';shell();}
 if(a==='trace'){traceIndex=(traceIndex+1)%trace.length;archIndex=trace[traceIndex];architecture();}if(a==='traceReset'){traceIndex=0;archIndex=0;architecture();}
});
async function copy(text){try{await navigator.clipboard.writeText(text);toast(t('Copied.',"已复制。"));}catch(e){dialog(t('Select and copy',"请选择并复制"),`<textarea style="min-height:300px" readonly>${esc(text)}</textarea>`);}}
document.addEventListener('input',e=>{if(e.target.id==='body'||e.target.id==='subject'){s.body=el('body').innerText;s.subject=el('subject').value;s.rev++;s.draftSaved=false;persist();el('saveState').textContent=t('Stored locally',"本地保存")+' · revision '+s.rev;if(el('candidatePanel'))el('candidatePanel').innerHTML=candidateHTML();}});
document.addEventListener('change',e=>{if(e.target.id==='recipient'){switchRecipient(e.target.value);studio();}if(e.target.dataset.fact){const id=e.target.dataset.fact;s.facts=e.target.checked?[...new Set([...s.facts,id])]:s.facts.filter(x=>x!==id);invalidateCandidate();persist();}if(e.target.id==='scenario'){scenario=e.target.value;workflow();}if(e.target.id==='mobileNav'){module=e.target.value;tab='product';shell();}if(e.target.id==='cvFile'){const f=e.target.files[0];el('fileStatus').textContent=f?`${f.name} · `+t('Filename only. Use the fictional sample or enter fields manually.',"仅记录文件名，请载入虚构示例或手动填写。"):'';}if(['purpose','emailLang','cta'].includes(e.target.id)){readBrief();invalidateCandidate();persist();}});
el('lang').onclick=()=>{lang=lang==='en'?'zh':'en';shell();};el('reset').onclick=()=>{s=initial();persist();tab='product';module='personas';phase=1;shell();toast(t('Demo reset.',"演示已重置。"));};el('closeModal').onclick=()=>el('modal').close();shell();
</script></body></html>
